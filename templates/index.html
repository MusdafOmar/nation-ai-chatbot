<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NationDev AI Coding Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 40px 20px;
        }
        .chat-container {
            max-width: 750px;
            margin: auto;
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px #0001;
        }
        h1 {
            color: #1f2937;
            margin-bottom: 8px;
        }
        .chat-container > p {
            color: #64748b;
            margin-top: 0;
        }
        #messages p {
            padding: 12px 16px;
            border-radius: 12px;
            background: #f1f5f9;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        #messages {
            max-height: 500px;
            overflow-y: auto;
        }
        textarea {
            font: inherit;
            border: 1px solid #cbd5e1;
            resize: vertical;
        }
        textarea:focus {
            outline: 2px solid #93c5fd;
        }
        button:hover {
            background: #1d4ed8;
        }
        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }
        #messages {
            min-height: 300px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 8px;
        }
        button {
            margin-top: 10px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    
        #messages .user-message {
            background: #2563eb;
            color: white;
            margin-left: 18%;
        }
        #messages .ai-message {
            background: #f1f5f9;
            color: #1e293b;
            margin-right: 12%;
        }
        #messages .error-message {
            background: #fee2e2;
            color: #991b1b;
        }

        /* AI-generated code formatting */
        #messages .ai-message pre {
            background: #0f172a;
            color: #e2e8f0;
            padding: 16px;
            border-radius: 10px;
            overflow-x: auto;
            white-space: pre;
            line-height: 1.5;
        }

        #messages .ai-message pre code {
            background: transparent;
            color: inherit;
            padding: 0;
            font-family: Consolas, Monaco, monospace;
            font-size: 14px;
        }

        #messages .ai-message :not(pre) > code {
            background: #e2e8f0;
            color: #be123c;
            padding: 2px 5px;
            border-radius: 4px;
            font-family: Consolas, Monaco, monospace;
        }

        #messages .ai-message p,
        #messages .ai-message li {
            line-height: 1.7;
        }

        #messages .ai-message pre,
        #messages .ai-message p {
            max-width: 100%;
        }
</style>
</head>
<body>
    <div class="chat-container">
        <h1>NationDev AI Coding Assistant</h1>
        <p>Ask coding questions, explain code, or debug errors.</p>

        <div id="messages">
            Welcome! How can I help you with coding today?
        </div>

        <textarea id="question" rows="4"
            placeholder="Type your coding question here..."></textarea>

        <button type="button" id="sendButton">Send Message</button>
    </div>

<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script>
const button = document.getElementById("sendButton");
const questionInput = document.getElementById("question");
const messages = document.getElementById("messages");
const conversationHistory = [];

button.addEventListener("click", async () => {
    const question = questionInput.value.trim();

    if (!question) {
        alert("Please enter a coding question.");
        return;
    }

    button.disabled = true;
    button.textContent = "Thinking...";

    const userMessage = document.createElement("p");
    userMessage.textContent = "You: " + question;
    userMessage.className = "user-message";
    messages.appendChild(userMessage);

    const loadingMessage = document.createElement("p");
    loadingMessage.className = "ai-message";
    loadingMessage.textContent = "Assistant is thinking...";
    loadingMessage.setAttribute("role", "status");
    messages.appendChild(loadingMessage);
    messages.scrollTop = messages.scrollHeight;

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                message: question,
                history: conversationHistory.slice(-10)
            })
        });

        const data = await response.json();

        const botMessage = document.createElement("p");
        if (response.ok) {
            if (window.marked && window.DOMPurify) {
                const formatted = marked.parse(data.reply);
                botMessage.innerHTML = DOMPurify.sanitize(formatted);
            } else {
                botMessage.textContent = data.reply;
            }
        } else {
            botMessage.textContent =
                "Error: " + (data.error || "Request failed");
        }

        botMessage.className = response.ok ? "ai-message" : "error-message";
        messages.appendChild(botMessage);
        if (response.ok) {
            conversationHistory.push(
                {role: "user", text: question},
                {role: "assistant", text: data.reply}
            );

            if (conversationHistory.length > 10) {
                conversationHistory.splice(
                    0,
                    conversationHistory.length - 10
                );
            }
        }

        questionInput.value = "";
    } catch (error) {
        const errorMessage = document.createElement("p");
        errorMessage.textContent = "Unable to contact the server.";
        errorMessage.className = "error-message";
        messages.appendChild(errorMessage);
    } finally {
        loadingMessage.remove();
        button.disabled = false;
        button.textContent = "Send Message";
        messages.scrollTop = messages.scrollHeight;
    }
});
</script>

</body>
</html>
